[project]
name = "rumbo-backend"
version = "0.1.0"
description = "Rumbo career intelligence assistant backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "anthropic>=0.116.0",
  "openai>=1.50",
  "pdfplumber>=0.11",
  "structlog>=24.4",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "reportlab>=4.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
