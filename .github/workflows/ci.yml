name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rumbo
          POSTGRES_PASSWORD: rumbo
          POSTGRES_DB: rumbo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rumbo"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
        working-directory: backend
      - name: Run tests
        run: uv run pytest -q
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://rumbo:rumbo@localhost:5433/rumbo

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
